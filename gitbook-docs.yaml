$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: "Mahiv's Library"
  structure:
    - type: section
      key: home
      title: Home
      path: home
      default: true
      children:
        - type: space
          key: home-space
          title: Home
          path: home
          default: true
          content:
            directory: ./home
    - type: section
      key: projects
      title: Projects
      path: projects
      icon: book-blank
      children:
        - type: space
          key: projects-space
          title: Projects
          path: projects
          default: true
          content:
            directory: ./projects
    - type: section
      key: library
      title: Library
      path: library
      icon: book-open
      children:
        - type: space
          key: library-space
          title: Library
          path: library
          default: true
          content:
            directory: ./documentation
